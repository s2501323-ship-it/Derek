<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOOM | Interactive Digital Garden</title>
    <style>
        /* BRANDING & BASE STYLES */
        :root {
            --floom-bg: #FAF7F2;
            --floom-dark: #1F1F1F;
            --floom-accent: #E85A4F;
            --floom-green: #4A6B5D;
            --floom-stem: #6B8E23;
            --floom-gold: #E6B800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--floom-bg);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--floom-dark);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* SVG CONTAINER */
        #garden-stage {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* INTERACTIVE & ANIMATION CLASSES */
        .interactive-element {
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Ambient Stem Swaying */
        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
            100% { transform: rotate(0deg); }
        }

        .sway-slow {
            animation: sway 6s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .sway-fast {
            animation: sway 3.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        /* Petal Blooming Effect */
        .petal {
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), fill 0.4s ease;
            transform-origin: center;
        }

        .flower-group:hover .petal {
            transform: scale(1.15) rotate(10deg);
            fill: #FF7B73;
        }

        .flower-group:hover .stem {
            stroke: #3B5449;
        }

        /* Bee Path Animation */
        @keyframes beeFlight {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(150px, -80px) scale(1.1); }
            50% { transform: translate(300px, 20px) scale(0.9); }
            75% { transform: translate(120px, 100px) scale(1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .anim-bee {
            animation: beeFlight 14s ease-in-out infinite;
        }

        /* Butterfly Flutter */
        @keyframes wingFlutter {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.2); }
        }

        .wing {
            animation: wingFlutter 0.25s infinite ease-in-out;
            transform-origin: center;
        }

        /* Sun Pulse */
        @keyframes sunGlow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .sun-ray {
            animation: sunGlow 4s ease-in-out infinite;
            transform-origin: 900px 100px;
        }

        /* UI OVERLAY */
        .ui-layer {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--floom-dark);
        }

        .brand-subtitle {
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #777;
            margin-top: 4px;
        }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="brand-title">FLOOM</div>
        <div class="brand-subtitle">Interactive Digital Garden</div>
    </div>

    <div class="instructions">Hover & Click Elements to Interact</div>

    <svg id="garden-stage" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FDFBF7" />
                <stop offset="100%" stop-color="#EFE6D5" />
            </linearGradient>

            <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE066" />
                <stop offset="100%" stop-color="#F9C74F" />
            </linearGradient>

            <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#A8C3A0" />
                <stop offset="100%" stop-color="#799A72" />
            </linearGradient>

            <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#5B8266" />
                <stop offset="100%" stop-color="#3B5449" />
            </linearGradient>

            <radialGradient id="roseGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF9AA2" />
                <stop offset="100%" stop-color="#E85A4F" />
            </radialGradient>

            <radialGradient id="sunflowerCenter" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#4A2E12" />
                <stop offset="100%" stop-color="#1F1F1F" />
            </radialGradient>

            <g id="leaf">
                <path d="M 0,0 C -15,-20 -20,-40 0,-60 C 20,-40 15,-20 0,0 Z" fill="#4A6B5D"/>
            </g>
        </defs>

        <rect width="1200" height="800" fill="url(#skyGrad)" />

        <g class="sun-ray">
            <circle cx="1000" cy="150" r="120" fill="url(#sunGrad)" opacity="0.3" />
            <circle cx="1000" cy="150" r="80" fill="url(#sunGrad)" opacity="0.6" />
            <circle cx="1000" cy="150" r="50" fill="url(#sunGrad)" />
        </g>

        <path d="M-50,650 Q250,520 650,620 T1250,580 L1250,850 L-50,850 Z" fill="url(#hillGrad1)" />
        <path d="M-50,690 Q450,580 850,680 T1250,630 L1250,850 L-50,850 Z" fill="url(#hillGrad2)" />

        <g class="flower-group sway-slow interactive-element" transform="translate(250, 720)" onclick="bloomBurst(this)">
            <path class="stem" d="M0,0 Q -20,-120 0,-260" fill="none" stroke="#4A6B5D" stroke-width="8" stroke-linecap="round"/>
            <use href="#leaf" transform="translate(-10, -100) rotate(-45) scale(0.7)"/>
            <use href="#leaf" transform="translate(8, -170) rotate(50) scale(0.7)"/>
            
            <g transform="translate(0, -260)">
                <circle class="petal" cx="0" cy="-35" r="28" fill="url(#roseGrad)" />
                <circle class="petal" cx="35" cy="0" r="28" fill="url(#roseGrad)" />
                <circle class="petal" cx="0" cy="35" r="28" fill="url(#roseGrad)" />
                <circle class="petal" cx="-35" cy="0" r="28" fill="url(#roseGrad)" />
                <circle cx="0" cy="0" r="22" fill="#FAF7F2" />
                <circle cx="0" cy="0" r="14" fill="#E85A4F" />
            </g>
        </g>

        <g class="flower-group sway-fast interactive-element" transform="translate(750, 750)" onclick="bloomBurst(this)">
            <path class="stem" d="M0,0 Q 30,-180 0,-380" fill="none" stroke="#3B5449" stroke-width="12" stroke-linecap="round"/>
            <use href="#leaf" transform="translate(-15, -140) rotate(-60) scale(1.2)"/>
            <use href="#leaf" transform="translate(20, -240) rotate(55) scale(1.1)"/>

            <g transform="translate(0, -380)">
                <g class="petal-ring">
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(0)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(30)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(60)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(90)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(120)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(150)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(180)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(210)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(240)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(270)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(300)"/>
                    <path class="petal" d="M0,0 L-12,-80 C0,-100 0,-100 12,-80 Z" fill="#F9C74F" transform="rotate(330)"/>
                </g>
                <circle cx="0" cy="0" r="45" fill="url(#sunflowerCenter)" />
            </g>
        </g>

        <g class="flower-group sway-slow interactive-element" transform="translate(480, 740)" onclick="bloomBurst(this)">
            <path class="stem" d="M0,0 Q 10,-100 0,-210" fill="none" stroke="#4A6B5D" stroke-width="7"/>
            <use href="#leaf" transform="translate(-8, -80) rotate(-35) scale(0.6)"/>
            
            <g transform="translate(0, -210)">
                <path class="petal" d="M-30,0 C-40,-50 -15,-70 0,-80 C15,-70 40,-50 30,0 Z" fill="#9B5DE5"/>
                <path class="petal" d="M-20,0 C-30,-40 -5,-60 0,-70 C5,-60 30,-40 20,0 Z" fill="#F15BB5"/>
            </g>
        </g>

        <g class="anim-bee" transform="translate(400, 300)">
            <ellipse class="wing" cx="-4" cy="-12" rx="7" ry="12" fill="#FFFFFF" opacity="0.7" transform="rotate(-20)"/>
            <ellipse class="wing" cx="4" cy="-12" rx="7" ry="12" fill="#FFFFFF" opacity="0.7" transform="rotate(20)"/>
            <ellipse cx="0" cy="0" rx="14" ry="10" fill="#F9C74F"/>
            <path d="M-4,-9 L-4,9 M3,-10 L3,10" stroke="#1F1F1F" stroke-width="3"/>
            <circle cx="12" cy="0" r="5" fill="#1F1F1F"/>
            <polygon points="-14,-2 -18,0 -14,2" fill="#1F1F1F"/>
        </g>

    </svg>

    <script>
        // Interactive Bloom Click Handler
        function bloomBurst(element) {
            const petals = element.querySelectorAll('.petal');
            petals.forEach((petal) => {
                petal.style.fill = '#E6B800';
                petal.style.transform = 'scale(1.3) rotate(25deg)';
                setTimeout(() => {
                    petal.style.fill = '';
                    petal.style.transform = '';
                }, 1000);
            });
        }
    </script>
</body>
</html>
